name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: transaction_event_gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d transaction_event_gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgres://app:app@localhost:5432/transaction_event_gateway
      REDIS_URL: redis://localhost:6379
      WEBHOOK_SECRET: test-webhook-secret-value
      WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS: "300"
      OUTBOX_DISPATCH_ENABLED: "false"
      OUTBOX_DISPATCH_INTERVAL_MS: "1000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check

      - name: Initialize Terraform without backend
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Validate Terraform scaffold
        run: terraform -chdir=infra/terraform validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build production Docker image
        run: docker build -t transaction-event-gateway:ci .

      - name: Verify schema drift
        run: DATABASE_URL=postgres://app:app@localhost:5432/transaction_event_gateway bash scripts/check-schema-drift.sh

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Content policy check
        shell: bash
        env:
          CONTENT_POLICY_PATTERN: ${{ secrets.CONTENT_POLICY_PATTERN }}
        run: |
          set -euo pipefail

          # Secrets are not passed to Dependabot runs or to pull requests from
          # forks, so the check is skipped there instead of failing.
          if [[ -z "${CONTENT_POLICY_PATTERN}" ]]; then
            echo "::notice::Content policy pattern is not available to this run; skipping the check."
            exit 0
          fi

          set +e
          matches="$(git grep -nIiE -e "${CONTENT_POLICY_PATTERN}" -- \
            README.md docs src test scripts infra migrations \
            package.json Dockerfile docker-compose.yml .env.example)"
          status=$?
          set -e

          if [[ ${status} -eq 0 ]]; then
            # Print locations only, so matched text never reaches public logs.
            cut -d: -f1,2 <<<"${matches}"
            echo "Content policy check failed."
            exit 1
          fi

          if [[ ${status} -ne 1 ]]; then
            echo "Content policy check could not run (git grep exited with ${status})."
            exit "${status}"
          fi

          echo "Content policy check passed."
